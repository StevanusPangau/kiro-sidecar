name: Draft Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract changelog notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(?P<body>.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          if not match:
              raise SystemExit(f"CHANGELOG.md section for {version} not found")

          notes = match.group("body").strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty")

          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --draft \
              --title "$TAG_NAME" \
              --target "$TARGET_SHA" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --draft \
              --title "$TAG_NAME" \
              --target "$TARGET_SHA" \
              --verify-tag \
              --notes-file release-notes.md
          fi
